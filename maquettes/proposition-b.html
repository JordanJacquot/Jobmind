<title>Jobmind proposition B</title>
<style>
:root { color-scheme: dark; --police: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --fond: #07060F; --fond2: #0D0B1E; --carte: rgba(18, 15, 38, 0.78); --carte2: rgba(30, 25, 60, 0.92); --ligne: #2A2450;
  --texte: #EEECF7; --doux: #A9A3C9; --pale: #6F6894; --J: #FFC93C; --J2: #FF8A3C; --T: #B04BFF; --S: #5CC8FF; --P: #2FD98A; --rouge: #FF6B81;
  --r: 18px; --doux-anim: cubic-bezier(.2, .9, .3, 1); }
@property --a-tour { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
@keyframes tourne { to { --a-tour: 360deg; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; color: var(--texte); font-family: var(--police); display: flex; flex-direction: column; align-items: center; padding: 18px 16px 24px;
  background: radial-gradient(1100px 600px at 50% 125%, rgba(176, 75, 255, 0.12), transparent 60%), radial-gradient(900px 500px at -10% -20%, rgba(255, 201, 60, 0.07), transparent 60%), var(--fond); }
button, input, select { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; padding: 0; text-align: inherit; }
button:focus, input:focus, select:focus { outline: none; }
button:focus-visible { box-shadow: 0 0 0 2px var(--fond), 0 0 0 4px var(--J); }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.consigne { width: min(1280px, 100%); margin: 0 0 12px; font-size: 15px; color: var(--doux); }
.consigne b { color: var(--texte); }

/* la fenêtre */
.appli { position: relative; width: min(1280px, 100%); height: 760px; border-radius: 22px; background: linear-gradient(180deg, #0C0A1F, #070612); isolation: isolate; display: flex; flex-direction: column; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55); }
.appli::before { content: ""; position: absolute; inset: -1.5px; border-radius: inherit; padding: 1.5px; pointer-events: none; z-index: 5;
  background: conic-gradient(from var(--a-tour), var(--J), var(--J2), var(--T), var(--J));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  animation: tourne 10s linear infinite; opacity: 0.5; }
.haut { flex: none; height: 62px; display: flex; align-items: center; gap: 12px; padding: 0 26px; border-bottom: 1px solid rgba(42, 36, 80, 0.6); }
.marque { display: flex; align-items: center; gap: 11px; font-size: 19px; font-weight: 800; margin-right: 26px; }
.marque svg { width: 30px; height: 30px; }
.onglets { display: flex; gap: 6px; height: 100%; }
.onglets button { position: relative; padding: 0 14px; font-size: 15px; font-weight: 600; color: var(--doux); transition: color 200ms ease; }
.onglets button:hover { color: var(--texte); }
.onglets button.oui { color: var(--texte); }
.onglets button::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--J); transform: scaleX(0); transition: transform 300ms var(--doux-anim); }
.onglets button.oui::after { transform: scaleX(1); }
.haut .jour { margin-left: auto; color: var(--doux); font-size: 14.5px; }
.ex { font-size: 11.5px; font-weight: 600; color: var(--pale); letter-spacing: .3px; }
.corps { position: relative; flex: 1; min-height: 0; overflow: hidden; border-radius: 0 0 22px 22px; }
.vue { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--ligne) transparent; transition: opacity 340ms ease, transform 420ms var(--doux-anim); }
.vue.cachee { opacity: 0; pointer-events: none; transform: translateY(14px); visibility: hidden; }

/* boutons communs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: 99px; font-weight: 700; font-size: 15px; white-space: nowrap; transition: transform 150ms ease, background 200ms ease, border-color 200ms ease; }
.btn:hover { transform: translateY(-2px); }
.btn.second { background: var(--carte2); border: 1px solid var(--ligne); }
.btn.second:hover { border-color: color-mix(in srgb, var(--J) 60%, var(--ligne)); }
.btn.plein { color: #1D1503; background: linear-gradient(90deg, var(--J), #FFB13C); }
.btn.petit { height: 36px; padding: 0 15px; font-size: 14px; }
.btn.fait { color: var(--P); background: rgba(47, 217, 138, 0.1); border: 1px solid rgba(47, 217, 138, 0.3); cursor: default; }
.btn.fait:hover { transform: none; }
.retour { display: inline-flex; align-items: center; gap: 9px; height: 44px; padding: 0 18px 0 12px; border-radius: 99px; border: 1px solid var(--ligne); background: var(--carte); font-size: 15px; font-weight: 600; transition: border-color 200ms ease; flex: none; }
.retour:hover { border-color: var(--J); }
.pastille { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 13px 0 11px; border-radius: 99px; font-size: 13.5px; font-weight: 700; white-space: nowrap; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); transition: background 200ms ease; }
.pastille::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
button.pastille:hover { background: color-mix(in srgb, var(--c) 22%, transparent); }
button.pastille::after { content: ""; width: 6px; height: 6px; margin-left: 2px; border-right: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor; transform: rotate(45deg) translate(-2px, -1px); opacity: .7; }

/* ============ le fil (accueil) */
.suivi-in { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 54px; padding: 30px 48px 40px 40px; }
.fil { position: relative; }
.fil::before { content: ""; position: absolute; left: 95px; top: 12px; bottom: 30px; width: 2px; border-radius: 2px; background: linear-gradient(180deg, var(--J) 0, color-mix(in srgb, var(--J) 40%, var(--ligne)) 210px, var(--ligne) 300px, rgba(42, 36, 80, 0.3)); }
.repere { position: relative; display: grid; grid-template-columns: 80px 32px 1fr; align-items: center; margin: 4px 0 10px; }
.repere span { grid-column: 3; font-size: 13px; font-weight: 700; color: var(--pale); letter-spacing: .6px; text-transform: uppercase; }
.repere::after { content: ""; grid-column: 2; grid-row: 1; justify-self: center; width: 10px; height: 10px; border-radius: 50%; background: var(--fond2); border: 2px solid var(--ligne); }
.repere.bientot span { color: var(--J); }
.repere.bientot::after { border-color: var(--J); background: var(--J); }
.repere.auj { margin: 18px 0 14px; }
.repere.auj span { color: var(--texte); text-transform: none; letter-spacing: 0; font-size: 15px; }
.repere.auj::after { width: 14px; height: 14px; border-color: var(--texte); background: var(--fond); }

.avenir { display: grid; grid-template-columns: 80px 32px 1fr; margin-bottom: 8px; }
.avenir .quand { text-align: right; padding-top: 16px; font-size: 14px; font-weight: 700; color: var(--J); line-height: 1.25; }
.avenir .quand small { display: block; font-weight: 500; color: var(--doux); }
.avenir .boite { grid-column: 3; display: flex; align-items: center; gap: 18px; padding: 15px 20px; border-radius: var(--r); background: linear-gradient(90deg, rgba(255, 201, 60, 0.085), rgba(255, 201, 60, 0.02)); }
.avenir .boite > div { flex: 1; min-width: 0; }
.avenir h3 { margin: 0; font-size: 18px; font-weight: 700; }
.avenir p { margin: 4px 0 0; font-size: 14.5px; color: var(--doux); }
.avenir.calme .boite { background: rgba(255, 255, 255, 0.03); }
.avenir.calme .quand { color: var(--J2); }
.avenir.sortie { animation: sort 420ms var(--doux-anim) forwards; }
@keyframes sort { to { opacity: 0; transform: translateX(30px); } }

.mois { margin: 26px 0 8px; }
.ent { position: relative; display: grid; grid-template-columns: 80px 32px minmax(0, 1fr); cursor: pointer; }
.ent .date { text-align: right; padding-top: 14px; line-height: 1; }
.ent .date b { display: block; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.ent .date small { font-size: 13px; color: var(--doux); }
.ent .point { justify-self: center; margin-top: 23px; width: 12px; height: 12px; border-radius: 50%; background: var(--fond); border: 2px solid var(--c); z-index: 1; }
.ent .contenu { padding: 12px 18px 16px; border-radius: var(--r); transition: background 220ms ease; }
.ent:hover .contenu { background: rgba(255, 255, 255, 0.035); }
.ent .ligne1 { display: flex; align-items: flex-start; gap: 14px; }
.ent .ligne1 > div { flex: 1; min-width: 0; }
.ent h3 { margin: 0; font-size: 21px; font-weight: 800; line-height: 1.2; }
.ent .qui { margin-top: 3px; font-size: 15px; color: var(--doux); }
.ent .qui b { color: var(--texte); font-weight: 600; }
.piste { position: relative; display: flex; gap: 30px; margin-top: 13px; padding-top: 2px; flex-wrap: wrap; row-gap: 6px; }
.piste .ev { position: relative; display: flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--doux); }
.piste .ev::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--pale)); }
.piste .ev + .ev::after { content: ""; position: absolute; left: -26px; width: 20px; top: 50%; height: 1px; background: var(--ligne); }
.piste .ev b { color: var(--texte); font-weight: 600; }
.piste .ev.futur::before { background: transparent; border: 1.5px solid var(--c); }
.piste .alerte { font-size: 13.5px; color: var(--J2); font-weight: 600; }
.ent.termine h3 { color: color-mix(in srgb, var(--texte) 72%, var(--fond)); }
.ent.flash .contenu { animation: flash 1400ms ease; }
@keyframes flash { 0%, 40% { background: rgba(255, 201, 60, 0.12); } }
.vide { color: var(--doux); padding: 30px 0 0 112px; font-size: 15px; }

.cote { position: sticky; top: 0; align-self: start; display: flex; flex-direction: column; gap: 28px; padding-top: 4px; }
.vers-offres { position: relative; display: block; width: 100%; padding: 22px 22px 20px; border-radius: 20px; background: linear-gradient(160deg, rgba(255, 201, 60, 0.12), rgba(255, 138, 60, 0.04) 70%); transition: transform 220ms var(--doux-anim); }
.vers-offres::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: linear-gradient(160deg, rgba(255, 201, 60, 0.55), rgba(255, 201, 60, 0.05)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
.vers-offres:hover { transform: translateY(-3px); }
.vers-offres .t { font-size: 14px; color: var(--doux); font-weight: 600; }
.vers-offres .n { display: block; margin: 8px 0 4px; font-size: 44px; font-weight: 800; line-height: 1; }
.vers-offres .s { font-size: 15px; color: var(--texte); }
.vers-offres .go { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-weight: 700; color: var(--J); font-size: 15px; }
.filtre-fil h4, .bilan h4 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--pale); }
.seg { display: flex; gap: 3px; padding: 4px; border-radius: 99px; background: var(--fond2); border: 1px solid var(--ligne); }
.seg button { flex: 1; text-align: center; padding: 8px 6px; border-radius: 99px; font-size: 13.5px; font-weight: 700; color: var(--doux); transition: all 200ms ease; }
.seg button:hover { color: var(--texte); }
.seg button.oui { color: #1D1503; background: var(--J); }
.bilan .l { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 0; font-size: 14.5px; color: var(--doux); }
.bilan .l + .l { border-top: 1px solid rgba(42, 36, 80, 0.6); }
.bilan .l b { color: var(--texte); font-size: 16px; font-variant-numeric: tabular-nums; }

/* menu des statuts */
#menu { position: absolute; z-index: 20; width: 220px; padding: 6px; border-radius: 16px; background: #15122E; border: 1px solid var(--ligne); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6); opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity 180ms ease, transform 220ms var(--doux-anim); }
#menu.ouvert { opacity: 1; transform: none; pointer-events: auto; }
#menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border-radius: 10px; font-size: 14.5px; font-weight: 600; }
#menu button::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
#menu button:hover { background: rgba(255, 255, 255, 0.06); }
#menu button.oui { color: var(--c); }

/* ============ les offres */
.off-in { padding: 24px 48px 40px; max-width: 1060px; margin: 0 auto; }
.off-tete { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
.off-tete h1 { margin: 0 0 0 4px; font-size: 26px; font-weight: 800; }
.off-tete .compte { color: var(--doux); font-size: 15px; }
.off-tete .seg { margin-left: auto; width: 330px; }
.cherche { display: flex; gap: 12px; margin-bottom: 14px; }
.champ { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 18px; border-radius: 99px; background: var(--fond2); border: 1px solid var(--ligne); transition: border-color 200ms ease; }
.champ:focus-within { border-color: var(--J); }
.champ svg { color: var(--doux); }
.champ input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 15.5px; }
.champ input::placeholder { color: var(--pale); }
.champ select { border: 0; background: transparent; font-size: 15px; cursor: pointer; }
.champ select option { background: #15122E; }
.champ.mots { flex: 1; }
.champ.lieu { width: 330px; }
.champ.lieu .sep { width: 1px; height: 22px; background: var(--ligne); }
.puces { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 26px; }
.puce { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 99px; border: 1px solid var(--ligne); font-size: 14.5px; font-weight: 600; color: var(--doux); transition: all 200ms ease; }
.puce:hover { color: var(--texte); border-color: color-mix(in srgb, var(--J) 45%, var(--ligne)); }
.puce.oui { color: #1D1503; background: var(--J); border-color: var(--J); }
.puce.oui svg { stroke-width: 2.6; }
.puce select { border: 0; background: transparent; font-weight: 600; cursor: pointer; color: inherit; }
.puce select option { background: #15122E; color: var(--texte); }
.puce.choix { padding: 0 8px 0 14px; }

.offre { position: relative; display: flex; align-items: center; gap: 22px; padding: 22px 24px 22px 28px; margin-bottom: 12px; border-radius: 20px; background: var(--carte); cursor: pointer; transition: transform 220ms var(--doux-anim), background 220ms ease; }
.offre:hover { transform: translateY(-2px); background: rgba(26, 22, 52, 0.9); }
.offre::before { content: ""; position: absolute; left: 0; top: 22px; bottom: 22px; width: 3px; border-radius: 0 3px 3px 0; background: var(--J); opacity: var(--o, .5); }
.offre .txt { flex: 1; min-width: 0; }
.offre h3 { margin: 0; font-size: 21px; font-weight: 800; }
.offre .meta { margin-top: 5px; font-size: 14.5px; color: var(--doux); }
.offre .meta b { color: var(--texte); font-weight: 600; }
.source { display: inline-block; margin-left: 6px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; color: var(--doux); background: rgba(255, 255, 255, 0.05); }
.raison { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 16.5px; color: var(--texte); }
.raison svg { color: var(--J); }
.offre .actions { display: flex; align-items: center; gap: 6px; flex: none; }
.rondb { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: var(--pale); transition: all 200ms ease; }
.rondb svg { width: 20px; height: 20px; }
.rondb:hover { color: var(--texte); background: rgba(255, 255, 255, 0.06); }
.rondb.oui { color: var(--J); }
.rondb.oui svg { fill: currentColor; }
.rondb.tard.oui svg { fill: none; }
.rondb.tard.oui { background: rgba(255, 201, 60, 0.12); }
.offre .prep { color: var(--J); font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; margin-left: 8px; }
.deja { font-size: 13px; font-weight: 700; color: var(--P); }
.hors { margin-top: 26px; }
.hors > button { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; color: var(--doux); padding: 8px 0; }
.hors > button:hover { color: var(--texte); }
.hors > button svg { transition: transform 300ms var(--doux-anim); }
.hors.ouvert > button svg { transform: rotate(90deg); }
.hors .liste { display: none; margin-top: 10px; }
.hors.ouvert .liste { display: block; }
.hors .offre { opacity: .62; padding: 16px 24px; }
.hors .offre::before { display: none; }
.hors .offre h3 { font-size: 17px; }
.hors .raison { font-size: 14.5px; color: var(--doux); margin-top: 6px; }
.hors .raison svg { color: var(--rouge); }

/* ============ la candidature */
.cand-in { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 0; height: 100%; }
.cand-in > aside { display: flex; flex-direction: column; min-height: 0; padding: 22px 26px 22px 30px; border-right: 1px solid rgba(42, 36, 80, 0.6); }
.cand-in > aside .retour { align-self: flex-start; margin-bottom: 22px; }
.c-titre { margin: 0; font-size: 25px; font-weight: 800; line-height: 1.15; }
.c-qui { margin-top: 6px; font-size: 15px; color: var(--doux); }
.c-qui b { color: var(--texte); font-weight: 600; }
.cand-in .raison { font-size: 15px; margin-top: 14px; align-items: flex-start; }
.cand-in .raison svg { margin-top: 2px; }
.archive-t { margin: 22px 0 10px; font-size: 13px; font-weight: 600; color: var(--pale); display: flex; justify-content: space-between; }
.archive { flex: 1; min-height: 0; overflow-y: auto; padding-right: 8px; font-size: 14px; line-height: 1.6; color: var(--doux); white-space: pre-line; scrollbar-width: thin; scrollbar-color: var(--ligne) transparent; }
.archive b { color: var(--texte); }
.cand-droite { min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--ligne) transparent; }
.c-barre { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 12px; padding: 18px 40px 16px; background: linear-gradient(180deg, #0B0920 75%, rgba(11, 9, 32, 0)); }
.c-barre h2 { margin: 0; font-size: 15px; font-weight: 600; color: var(--doux); }
.c-barre .droite { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.c-page { max-width: 720px; margin: 4px auto 0; padding: 0 40px 44px; }
.reglage { display: flex; align-items: center; gap: 18px; margin-bottom: 14px; }
.naturel { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--doux); }
.naturel b { color: var(--texte); font-size: 15px; font-variant-numeric: tabular-nums; }
.jauge { width: 110px; height: 6px; border-radius: 6px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
.jauge i { display: block; height: 100%; border-radius: inherit; background: var(--J); transition: width 600ms var(--doux-anim); }
.reglage .seg { margin-left: auto; width: 290px; }
.feuille { position: relative; padding: 46px 56px 50px; border-radius: 6px; background: #EEE8DA; color: #2B2533; font-family: Georgia, "Times New Roman", serif; font-size: 17px; line-height: 1.7;
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.4) inset, 0 24px 50px rgba(0, 0, 0, 0.55), 0 4px 10px rgba(0, 0, 0, 0.3); transform: rotate(-0.25deg); transition: transform 400ms var(--doux-anim); }
.feuille:focus-within { transform: none; }
.feuille .lettre { outline: none; min-height: 200px; }
.feuille .lettre p { margin: 0 0 14px; }
.feuille .lettre p:last-child { margin: 0; }
.feuille mark { background: linear-gradient(transparent 52%, rgba(255, 186, 40, 0.55) 52%); color: inherit; padding: 0 2px; cursor: help; border-radius: 2px; }
.feuille.brut { background: #DAD6CF; color: #48424F; }
.feuille .copier-l { position: absolute; right: 16px; top: 14px; font-family: var(--police); }
.copier { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 99px; font-size: 13.5px; font-weight: 700; color: var(--pale); border: 1px solid transparent; background: transparent; transition: all 200ms ease; flex: none; }
.copier svg { width: 15px; height: 15px; }
.copier:hover { color: var(--texte); border-color: var(--J); }
.copier.ok { color: var(--P); border-color: rgba(47, 217, 138, 0.4); }
.feuille .copier { background: rgba(43, 37, 51, 0.06); border-color: rgba(43, 37, 51, 0.18); color: #5A5262; }
.feuille .copier:hover { color: #2B2533; border-color: rgba(43, 37, 51, 0.4); }
.feuille .copier.ok { color: #157A4A; }
.legende { margin: 14px 4px 0; font-size: 13.5px; color: var(--doux); display: flex; align-items: center; gap: 9px; }
.legende i { width: 22px; height: 10px; border-radius: 2px; background: rgba(255, 186, 40, 0.6); flex: none; }
.champs-t { margin: 38px 0 6px; font-size: 13px; font-weight: 600; color: var(--pale); }
.champ-c { display: flex; align-items: flex-start; gap: 18px; padding: 16px 0; }
.champ-c + .champ-c { border-top: 1px solid rgba(42, 36, 80, 0.6); }
.champ-c > div { flex: 1; min-width: 0; }
.champ-c label { display: block; font-size: 13.5px; font-weight: 600; color: var(--doux); margin-bottom: 4px; }
.champ-c p { margin: 0; font-size: 15.5px; line-height: 1.5; }
.envoye { display: inline-flex; align-items: center; gap: 10px; font-size: 15px; color: var(--doux); }

/* ============ l'envoi */
.env-in { padding: 22px 48px 40px; max-width: 1180px; margin: 0 auto; }

.env-corps { display: grid; grid-template-columns: minmax(0, 1fr) 270px; align-items: start; gap: 36px; }

.m-l { display: flex; align-items: baseline; gap: 16px; padding: 14px 26px; font-size: 15.5px; border-bottom: 1px solid rgba(42, 36, 80, 0.6); }

.pj { display: inline-flex; align-items: center; gap: 10px; margin: 8px 26px 22px; padding: 10px 16px 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); font-size: 14.5px; font-weight: 600; }
.pj svg { color: var(--J); }

.env-bas { display: flex; align-items: center; gap: 22px; margin-top: 24px; }

.btn.grand { height: 56px; padding: 0 34px; font-size: 17px; min-width: 210px; }

.btn.envoi::after { content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: rgba(29, 21, 3, 0.45); transform-origin: left; animation: charge 1300ms linear forwards; }
@keyframes charge { from { transform: scaleX(0); } }
.lien { font-size: 13.5px; font-weight: 600; color: var(--pale); display: inline-flex; align-items: center; gap: 6px; flex: none; }

.pause { display: flex; align-items: center; gap: 10px; margin: 20px 4px 0; font-size: 14.5px; color: var(--doux); }
.pause i { width: 9px; height: 9px; border-radius: 50%; background: var(--J); flex: none; }
@keyframes entre { from { opacity: 0; transform: translateX(30px); } }
.nv-msg { display: flex; gap: 12px; padding: 16px 20px; background: rgba(255, 201, 60, 0.1); font-size: 15px; line-height: 1.45; }
.nv-msg svg { color: var(--J); margin-top: 2px; width: 20px; height: 20px; }

.nv-barre { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #120F28; border-bottom: 1px solid var(--ligne); font-size: 13px; color: var(--doux); }

.nv-page { background: #F4F5F7; color: #2A2F3A; padding: 0 0 22px; font-family: Arial, sans-serif; }
.nv-page .site { display: flex; align-items: center; gap: 9px; padding: 12px 20px; background: #1F3B5C; color: #fff; font-weight: 700; font-size: 15px; }

.robot { display: flex; align-items: center; gap: 12px; margin: 14px 20px 0; padding: 14px 16px; border: 1px solid #D0D4DB; border-radius: 4px; background: #FAFAFA; box-shadow: 0 0 0 3px rgba(255, 201, 60, 0.9); font-size: 14.5px; color: #2A2F3A; cursor: pointer; }

.nv-pied { padding: 12px 20px; font-size: 13px; color: var(--pale); }
.fini { text-align: center; padding: 70px 20px 40px; animation: entre2 520ms var(--doux-anim); }

.rond-ok { width: 84px; height: 84px; margin: 0 auto 26px; border-radius: 50%; display: grid; place-items: center; background: rgba(47, 217, 138, 0.12); color: var(--P); }

.fini h2 { margin: 0; font-size: 30px; font-weight: 800; }
.fini p { margin: 10px 0 30px; font-size: 16px; color: var(--doux); }
.fini .bt { display: flex; gap: 12px; justify-content: center; }

#bulle { position: absolute; left: 50%; bottom: 22px; z-index: 30; transform: translate(-50%, 20px); padding: 11px 20px; border-radius: 99px; background: var(--carte2); border: 1px solid var(--ligne); font-size: 14.5px; opacity: 0; pointer-events: none; transition: opacity 220ms ease, transform 300ms var(--doux-anim); white-space: nowrap; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }

// ---------------------------------------------------------------- textes générés (exemple)
const GENERIQUE = "Je suis motivé et prêt à relever de nouveaux défis au sein de votre entreprise.";
function lettre(o, avecGenerique) {
  return [
    'Bonjour,',
    `J'ai vu votre annonce pour le poste de ${o.t.toLowerCase()} à ${o.v}. Je suis disponible tout de suite, et ${o.v} est à ${o.km} km de chez moi.`,
    PHRASE[o.cat],
    avecGenerique ? `<mark title="Trop générique : dis plutôt un fait de ton parcours">${GENERIQUE}</mark>` : null,
    'Je peux passer vous voir quand vous voulez pour en parler.',
    'Bonne journée,<br>Jordan'
  ].filter(Boolean).map(p => '<p>' + p + '</p>').join('');
}
function brut(o) {
  return [
    'Madame, Monsieur,',
    `C'est avec un grand intérêt que j'ai pris connaissance de votre offre de ${o.t.toLowerCase()}. Fort d'une solide expérience, je suis convaincu que mon profil saura répondre pleinement à vos attentes.`,
    PHRASE[o.cat].replace("J'ai", "Au cours de mon parcours, j'ai"),
    GENERIQUE,
    "Dans l'attente de votre retour, je vous prie d'agréer, Madame, Monsieur, l'expression de mes salutations distinguées."
  ].map(p => '<p>' + p + '</p>').join('');
}
function champs(o) {
  return [
    ['Objet du message', `Candidature : ${o.t.toLowerCase()} (${o.v})`],
    ['Pourquoi ce poste ?', POURQUOI[o.cat]],
    ['Vos disponibilités', 'Tout de suite. En journée, en équipe ou le samedi.'],
    ['Message court', `Bonjour, je vous envoie ma candidature pour le poste de ${o.t.toLowerCase()}. Disponible tout de suite, à ${o.km} km. Bonne journée, Jordan`]
  ];
}
function archive(o) {
  const exig = o.dip ? o.dip : 'Aucun diplôme demandé';
  const exp = o.deb ? 'Débutant accepté, formation sur place' : 'Expérience demandée : ' + (o.exp || '1 an');
  return `<b>${esc(o.e)}</b> recrute un ${esc(o.t.toLowerCase())} pour son site de ${esc(o.v)}.\n\n<b>Vos missions</b>\n${MISSIONS[o.cat].map(m => '· ' + m).join('\n')}\n\n<b>Votre profil</b>\n· ${exig}\n· ${exp}\n· Sérieux et ponctuel\n\n<b>Le poste</b>\n· Contrat : ${o.ct}\n· 35 heures par semaine\n· ${o.tele ? 'Télétravail possible 2 jours par semaine' : 'Sur place'}\n· Prise de poste dès que possible\n\nPour postuler, envoyez votre CV et quelques lignes par le formulaire du site.\n\nOffre lue sur ${o.src}.`;
}

// ---------------------------------------------------------------- navigation
let vue = 'suivi', pile = [], courant = null;
function montrer(v, arg, sansPile) {
  if (!sansPile && v !== vue) pile.push([vue, courant]);
  vue = v;
  const cible = { candidature: 'cand' }[v] || v;
  ['suivi', 'offres', 'cand', 'envoi'].forEach(n => $('#v-' + n).classList.toggle('cachee', n !== cible));
  $('#o-suivi').classList.toggle('oui', v === 'suivi');
  $('#o-offres').classList.toggle('oui', v === 'offres');
  if (v === 'candidature') { courant = arg || { o: OFFRES[0] }; dessinerCand(); $('#cand-droite').scrollTop = 0; $('#c-archive').scrollTop = 0; }
  if (v === 'envoi') { if (arg) courant = arg; if (!courant) courant = { o: OFFRES[0] }; env = { etape: arg && arg.etape || 'pret' }; dessinerEnvoi(); $('#v-envoi').scrollTop = 0; }
  if (v === 'suivi') dessinerFil();
  if (v === 'offres') dessinerOffres();
  fermerMenu();
  history.replaceState(null, '', '#' + v);
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-aller]');
  if (a) { if (a.dataset.aller === 'suivi') pile = []; montrer(a.dataset.aller); }
  if (e.target.closest('[data-retour]')) { const p = pile.pop(); if (p) { courant = p[1]; montrer(p[0], p[1], true); } else montrer('suivi', null, true); }
  if (!e.target.closest('#menu') && !e.target.closest('.pastille')) fermerMenu();
});

// ---------------------------------------------------------------- le fil
let filtreFil = 'tout';
const premier = c => c.ev[0][1];
const dernier = c => c.ev.filter(x => x[1] <= AUJ).slice(-1)[0][1];
function aVenir() {
  const out = [];
  CANDS.forEach(c => c.ev.forEach(x => { if (x[1] > AUJ && c.st === 'entretien') out.push({ c, k: 'rdv', d: x[1], h: x[2] }); }));
  CANDS.forEach(c => {
    if (c.st === 'envoyee' && jours(dernier(c)) >= 10) out.push({ c, k: 'relance', n: jours(dernier(c)) });
    else if ((c.st === 'envoyee' || c.st === 'relancee') && jours(premier(c)) >= 21) out.push({ c, k: 'silence', n: jours(premier(c)) });
  });
  return out;
}
function quandTxt(d) { const n = jours(AUJ, d); return n === 1 ? 'Demain' : n < 7 ? 'Dans ' + n + ' jours' : fd(d); }
function dessinerFil() {
  let h = '';
  const av = aVenir();
  h += '<div class="repere bientot"><span>Ce qui arrive</span></div>';
  if (!av.length) h += '<div class="avenir calme"><div class="quand"></div><div class="boite"><div><p>Rien à faire pour l\'instant.</p></div></div></div>';
  av.forEach(a => {
    const c = a.c;
    if (a.k === 'rdv') h += `<div class="avenir"><div class="quand">${quandTxt(a.d)}<small>${a.h || ''}</small></div><div class="boite"><div><h3>Entretien chez ${esc(c.e)}</h3><p>${esc(c.t)}, ${esc(c.v)}. Relis ce que tu as envoyé avant d'y aller.</p></div><button class="btn second petit" data-ouvrir="${c.id}">Relire ma candidature</button></div></div>`;
    if (a.k === 'relance') h += `<div class="avenir calme" data-av="${c.id}"><div class="quand">Relance<small>à faire</small></div><div class="boite"><div><h3>${esc(c.e)}, sans nouvelle</h3><p>${esc(c.t)}. Envoyée il y a ${a.n} jours.</p></div><button class="btn second petit" data-relance="${c.id}">C'est relancé</button></div></div>`;
    if (a.k === 'silence') h += `<div class="avenir calme" data-av="${c.id}"><div class="quand">${a.n} jours<small>sans réponse</small></div><div class="boite"><div><h3>${esc(c.e)} ne répond pas</h3><p>${esc(c.t)}. Déjà relancée le ${fd(dernier(c))}</p></div><button class="btn second petit" data-silence="${c.id}">Classer sans réponse</button></div></div>`;
  });
  h += '<div class="repere auj"><span>Aujourd\'hui, mercredi 18 novembre</span></div>';
  const liste = CANDS.filter(c => filtreFil === 'tout' || (filtreFil === 'cours') === EN_COURS.includes(c.st)).sort((a, b) => premier(b) - premier(a));
  let m = -1;
  liste.forEach(c => {
    const d = premier(c);
    if (d.getMonth() !== m) { m = d.getMonth(); h += `<div class="repere mois"><span>${MOISL[m]}</span></div>`; }
    const s = ST[c.st];
    const piste = c.ev.map(x => `<span class="ev${x[1] > AUJ ? ' futur' : ''}" style="--c:${ST[x[0]].c}"><b>${ST[x[0]].t}</b>${fd(x[1])}${x[2] ? ', ' + x[2] : ''}</span>`).join('');
    const alerte = c.st === 'envoyee' && jours(dernier(c)) >= 10 ? `<span class="alerte">Relance à faire</span>` : '';
    h += `<div class="ent${EN_COURS.includes(c.st) ? '' : ' termine'}" data-ouvrir="${c.id}" id="e-${c.id}" style="--c:${s.c}">
      <div class="date"><b>${d.getDate()}</b><small>${MOIS[d.getMonth()]}</small></div><span class="point"></span>
      <div class="contenu"><div class="ligne1"><div><h3>${esc(c.t)}</h3><div class="qui"><b>${esc(c.e)}</b> · ${esc(c.v)}</div></div>
      <button class="pastille" style="--c:${s.c}" data-statut="${c.id}" title="Changer le statut">${s.t}</button></div>
      <div class="piste">${piste}${alerte}</div></div></div>`;
  });
  if (!liste.length) h += '<div class="vide">Aucune candidature ici.</div>';
  $('#fil').innerHTML = h;
  dessinerBilan();
}
function dessinerBilan() {
  const nov = CANDS.filter(c => premier(c).getMonth() === 10).length;
  const rep = CANDS.filter(c => REPONDU.includes(c.st) || c.ev.some(x => REPONDU.includes(x[0]))).length;
  const attente = CANDS.filter(c => c.st === 'envoyee' || c.st === 'relancee').length;
  $('#bilan').innerHTML = `<h4>En bref</h4>
    <div class="l">Envoyées en novembre<b>${nov}</b></div>
    <div class="l">En attente de réponse<b>${attente}</b></div>
    <div class="l">Ont répondu<b>${rep} sur ${CANDS.length}</b></div>`;
}
$('#seg-fil').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; filtreFil = b.dataset.f; $('#seg-fil').querySelectorAll('button').forEach(x => x.classList.toggle('oui', x === b)); dessinerFil(); });
const trouverC = id => CANDS.find(c => c.id === id);
function changerStatut(c, st) {
  if (c.st === st) return;
  c.st = st;
  if (st !== 'envoyee') c.ev = c.ev.filter(x => x[1] <= AUJ || st === 'entretien').concat([[st, AUJ]]);
  c.ev.sort((a, b) => a[1] - b[1]);
}
$('#fil').addEventListener('click', e => {
  const r = e.target.closest('[data-relance]'), s = e.target.closest('[data-silence]'), st = e.target.closest('[data-statut]');
  if (st) { e.stopPropagation(); ouvrirMenu(st, trouverC(st.dataset.statut)); return; }
  if (r || s) {
    const c = trouverC((r || s).dataset.relance || (r || s).dataset.silence);
    const bloc = (r || s).closest('.avenir'); bloc.classList.add('sortie');
    setTimeout(() => { changerStatut(c, r ? 'relancee' : 'sans'); dessinerFil(); const el = $('#e-' + c.id); if (el) { el.classList.add('flash'); } bulle(r ? `<b>${esc(c.e)}</b> : relance notée aujourd'hui` : `<b>${esc(c.e)}</b> classée sans réponse`); }, 380);
    return;
  }
  const o = e.target.closest('[data-ouvrir]');
  if (o) montrer('candidature', { c: trouverC(o.dataset.ouvrir) });
});

// menu des statuts
let menuPour = null;
function ouvrirMenu(btn, c) {
  const m = $('#menu'), ap = $('#appli').getBoundingClientRect(), br = btn.getBoundingClientRect();
  menuPour = c;
  m.innerHTML = Object.entries(ST).map(([k, s]) => `<button data-st="${k}" class="${k === c.st ? 'oui' : ''}" style="--c:${s.c}">${s.t}</button>`).join('');
  let top = br.bottom - ap.top + 6; if (top + 330 > ap.height) top = br.top - ap.top - 330;
  m.style.top = top + 'px'; m.style.left = Math.max(10, Math.min(br.right - ap.left - 220, ap.width - 230)) + 'px';
  m.classList.add('ouvert');
}
function fermerMenu() { $('#menu').classList.remove('ouvert'); }
$('#menu').addEventListener('click', e => {
  const b = e.target.closest('[data-st]'); if (!b || !menuPour) return;
  const c = menuPour; changerStatut(c, b.dataset.st); fermerMenu();
  if (vue === 'suivi') { dessinerFil(); $('#e-' + c.id)?.classList.add('flash'); } else dessinerCand();
  bulle(`<b>${esc(c.e)}</b> : ${ST[c.st].t.toLowerCase()}`);
});

// ---------------------------------------------------------------- les offres
const F = { mots: '', rayon: 30, dip: false, deb: false, tele: false, ct: '', tab: 'tout', fav: new Set([2]), tard: new Set([5]), postule: new Set() };
function dessinerOffres() {
  const mots = F.mots.trim().toLowerCase();
  const liste = OFFRES.filter(o => {
    if (F.tab === 'fav' && !F.fav.has(o.id)) return false;
    if (F.tab === 'tard' && !F.tard.has(o.id)) return false;
    if (mots && !(o.t + ' ' + o.e + ' ' + o.v + ' ' + o.r).toLowerCase().includes(mots)) return false;
    if (o.km > F.rayon && !(o.tele && F.tele)) return false;
    if (F.dip && o.dip) return false;
    if (F.deb && !o.deb) return false;
    if (F.tele && !o.tele) return false;
    if (F.ct && o.ct !== F.ct) return false;
    return true;
  });
  $('#compte').textContent = liste.length + (liste.length > 1 ? ' offres, les plus utiles en haut' : liste.length ? ' offre' : '');
  $('#liste').innerHTML = liste.map((o, i) => `<div class="offre" data-offre="${o.id}" style="--o:${Math.max(.15, 1 - i * .09).toFixed(2)}">
      <div class="txt"><h3>${esc(o.t)}</h3>
        <div class="meta"><b>${esc(o.e)}</b> · ${esc(o.v)}, ${o.km} km · ${o.ct}<span class="source">${o.src}</span></div>
        <div class="raison">${IC.ok}${esc(o.r)}</div></div>
      <div class="actions">
        ${F.postule.has(o.id) ? '<span class="deja">Envoyée</span>' : ''}
        <button class="rondb${F.fav.has(o.id) ? ' oui' : ''}" data-fav="${o.id}" title="Favori">${IC.etoile}</button>
        <button class="rondb tard${F.tard.has(o.id) ? ' oui' : ''}" data-tard="${o.id}" title="À postuler plus tard">${IC.tard}</button>
        <span class="prep">Préparer ${IC.fleche}</span></div></div>`).join('') || '<div class="rien vide" style="padding-left:0">Aucune offre avec ces filtres. Élargis le rayon ou enlève un filtre.</div>';
  $('#hors-t').textContent = NB_HORS + ' offres hors sujet rangées à part';
  $('#hors-l').innerHTML = HORS.map(o => `<div class="offre"><div class="txt"><h3>${esc(o.t)}</h3><div class="meta"><b>${esc(o.e)}</b> · ${esc(o.v)}</div><div class="raison">${IC.non}${esc(o.r)}</div></div></div>`).join('');
}
$('#mots').addEventListener('input', e => { F.mots = e.target.value; dessinerOffres(); });
$('#rayon').addEventListener('change', e => { F.rayon = +e.target.value; dessinerOffres(); });
$('#ville').addEventListener('change', () => { bulle('Exemple : les distances restent calculées depuis Metz'); });
$('#contrat').addEventListener('change', e => { F.ct = e.target.value; dessinerOffres(); });
[['#p-dip', 'dip'], ['#p-deb', 'deb'], ['#p-tele', 'tele']].forEach(([s, k]) => $(s).addEventListener('click', e => { F[k] = !F[k]; e.currentTarget.classList.toggle('oui', F[k]); dessinerOffres(); }));
$('#seg-off').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; F.tab = b.dataset.t; $('#seg-off').querySelectorAll('button').forEach(x => x.classList.toggle('oui', x === b)); dessinerOffres(); });
$('#hors > button').addEventListener('click', () => $('#hors').classList.toggle('ouvert'));
$('#liste').addEventListener('click', e => {
  const f = e.target.closest('[data-fav]'), t = e.target.closest('[data-tard]');
  if (f) { const id = +f.dataset.fav; F.fav.has(id) ? F.fav.delete(id) : F.fav.add(id); bulle(F.fav.has(id) ? 'Ajoutée aux <b>favoris</b>' : 'Retirée des favoris'); dessinerOffres(); return; }
  if (t) { const id = +t.dataset.tard; F.tard.has(id) ? F.tard.delete(id) : F.tard.add(id); bulle(F.tard.has(id) ? 'Rangée dans <b>plus tard</b>' : 'Retirée de plus tard'); dessinerOffres(); return; }
  const o = e.target.closest('[data-offre]'); if (o) montrer('candidature', { o: OFFRES.find(x => x.id === +o.dataset.offre) });
});

// ---------------------------------------------------------------- la candidature
let version = 'fin', texteFinal = '';
function dessinerCand() {
  const envoyee = !!courant.c, o = courant.c || courant.o;
  $('#c-titre').textContent = o.t;
  $('#c-qui').innerHTML = `<b>${esc(o.e)}</b> · ${esc(o.v)}, ${o.km}&nbsp;km · ${o.ct}<span class="source">${o.src}</span>`;
  $('#c-raison').innerHTML = o.r ? IC.ok + esc(o.r) : '';
  $('#c-raison').style.display = o.r ? '' : 'none';
  $('#c-archive').innerHTML = archive(o);
  version = 'fin';
  $('#seg-v').querySelectorAll('button').forEach(x => x.classList.toggle('oui', x.dataset.v === 'fin'));
  const deja = !envoyee && F.postule.has(o.id);
  if (envoyee) {
    const c = courant.c, s = ST[c.st];
    $('#c-etat').innerHTML = `<span class="envoye">Ce que tu as envoyé le ${fdl(premier(c))}</span>`;
    $('#c-actions').innerHTML = `<button class="pastille" style="--c:${s.c}" data-statut="${c.id}">${s.t}</button><button class="btn second" data-ouvre>${IC.ouvrir}Ouvrir l'offre</button>`;
    $('#reglage').style.display = 'none'; $('#legende').style.display = 'none';
    texteFinal = lettre(o, false);
  } else {
    $('#c-etat').textContent = deja ? 'Candidature envoyée aujourd\'hui' : 'Ta candidature, prête à relire';
    $('#c-actions').innerHTML = `<button class="btn second" data-ouvre>${IC.ouvrir}Ouvrir l'offre</button>` + (deja ? `<span class="btn fait">${IC.ok}Envoyée</span>` : `<button class="btn plein" id="vers-envoi">${IC.envoi}Envoyer ma candidature</button>`);
    $('#reglage').style.display = ''; $('#legende').style.display = '';
    texteFinal = lettre(o, true);
  }
  afficherLettre(envoyee);
  $('#champs').innerHTML = champs(o).map((x, i) => `<div class="champ-c"><div><label>${x[0]}</label><p id="ch${i}">${esc(x[1])}</p></div><button class="copier" data-copie="ch${i}">${IC.copie}Copier</button></div>`).join('');
}
function afficherLettre(lecture) {
  const o = courant.c || courant.o, l = $('#lettre');
  const b = version === 'brut';
  l.innerHTML = b ? brut(o) : texteFinal;
  l.contentEditable = !b && !lecture;
  $('#feuille').classList.toggle('brut', b);
  noter();
}
function noter() {
  if (courant.c) return;
  const b = version === 'brut', t = $('#lettre').innerText;
  const n = b ? 41 : t.includes(GENERIQUE) ? 82 : 94;
  $('#score').textContent = n + ' sur 100';
  $('#jauge').style.width = n + '%';
  $('#legende').style.visibility = !b && $('#lettre mark') ? 'visible' : 'hidden';
}
$('#lettre').addEventListener('input', () => {
  const m = $('#lettre mark'); if (m && m.innerText.trim() !== GENERIQUE) { m.replaceWith(document.createTextNode(m.innerText)); }
  texteFinal = $('#lettre').innerHTML; noter();
});
$('#lettre').addEventListener('click', e => { const m = e.target.closest('mark'); if (m && $('#lettre').isContentEditable) { const r = document.createRange(); r.selectNodeContents(m); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } });
$('#seg-v').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (version === 'fin') texteFinal = $('#lettre').innerHTML; version = b.dataset.v; $('#seg-v').querySelectorAll('button').forEach(x => x.classList.toggle('oui', x === b)); afficherLettre(false); });
$('#v-cand').addEventListener('click', e => {
  const st = e.target.closest('[data-statut]'); if (st) { e.stopPropagation(); ouvrirMenu(st, trouverC(st.dataset.statut)); return; }
  if (e.target.closest('[data-ouvre]')) bulle('Exemple : ouvrirait l\'offre sur ' + (courant.c || courant.o).src);
  if (e.target.closest('#vers-envoi')) { if (version === 'fin') texteFinal = $('#lettre').innerHTML; montrer('envoi'); }
  const c = e.target.closest('[data-copie]');
  if (c) {
    const src = c.dataset.copie === 'lettre' ? $('#lettre').innerText : $('#' + c.dataset.copie).innerText;
    copier(src); c.classList.add('ok'); c.innerHTML = IC.ok + 'Copié';
    setTimeout(() => { c.classList.remove('ok'); c.innerHTML = IC.copie + 'Copier'; }, 1600);
  }
});
function copier(t) {
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).catch(() => repli(t)); else repli(t);
  function repli(x) { const a = document.createElement('textarea'); a.value = x; a.style.position = 'fixed'; a.style.opacity = '0'; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (er) {} a.remove(); }
}

// ---------------------------------------------------------------- l'envoi
const MAILS = { 1: 'emploi@trois-frontieres-logistique.fr', 3: 'rh@proprete-lorraine-services.fr', 8: 'recrutement@colis-est.fr', 11: 'equipe@marche-pays-messin.fr', 13: 'contact@paindore-livraisons.fr' };
OFFRES.forEach(o => { o.mail = MAILS[o.id]; o.captcha = o.id === 2 || o.id === 5; });
const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const IC2 = {
  trombone: '<svg class="i" viewBox="0 0 24 24"><path d="M20 11.5l-8.2 8.2a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg>',
  mail: '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/></svg>',
  site: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>',
  cadenas: '<svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  main: '<svg class="i" viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>'
};
let env = { etape: 'pret' };
const PROFIL = { nom: 'Jordan', mail: 'jordan.exemple@gmail.com', tel: '06 00 00 00 00' };
function texteLettre() { const d = document.createElement('div'); d.innerHTML = texteFinal || lettre(courant.o, true); return [...d.querySelectorAll('p')].map(p => { const t = document.createElement('textarea'); t.innerHTML = p.innerHTML.replace(/<br\s*\/?>/g, '\n').replace(/<[^>]+>/g, ''); return t.value; }); }
function dessinerEnvoi() {
  const o = courant.o, parMail = !!o.mail, site = o.e, z = $('#env-corps');
  $('#env-qui').innerHTML = `<b>${esc(o.t)}</b> · ${esc(o.e)}, ${esc(o.v)}`;
  $('#env-mode').innerHTML = parMail ? IC2.mail + 'Par mail' : IC2.site + 'Sur le site';
  $('#env-mode').style.display = env.etape === 'fini' ? 'none' : '';
  z.classList.toggle('attente', env.etape === 'captcha');
  if (env.etape === 'fini') {
    z.innerHTML = `<div class="fini"><div class="rond-ok">${IC.ok}</div><h2>Candidature envoyée, ajoutée au suivi</h2>
      <p>${esc(o.t)} chez ${esc(o.e)}, ${parMail ? 'par mail depuis ton Gmail' : 'sur le site ' + esc(site)}, le 18 novembre.</p>
      <div class="bt"><button class="btn plein" data-aller="suivi">Voir mon suivi</button><button class="btn second" data-aller="offres">Retour aux offres</button></div></div>`;
    return;
  }
  const paras = texteLettre();
  const bouton = env.etape === 'envoi' ? `<span class="btn plein grand envoi">Envoi en cours</span>`
    : env.etape === 'captcha' ? `<span class="btn grand attend">Le site t'attend</span>`
    : `<button class="btn plein grand" id="go">${IC.envoi}Envoyer</button>`;
  let h;
  const cote = (txt, lien) => `<div class="env-cote">${bouton}<p>${txt}</p><button class="lien" data-copie-mail>${IC.copie}${lien}</button></div>`;
  if (parMail) {
    h = `<div class="mail">
      <div class="m-l"><span>De</span>${PROFIL.mail}<em>ton Gmail</em></div>
      <div class="m-l"><span>À</span>${esc(o.mail)}<em>trouvée dans l'offre</em></div>
      <div class="m-l"><span>Objet</span>Candidature : ${esc(o.t.toLowerCase())} (${esc(o.v)})</div>
      <div class="m-corps">${paras.map(p => '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>').join('')}</div>
      <div class="pj">${IC2.trombone}CV Jordan.pdf <small>182 Ko</small></div></div>`
      + cote('Le mail part de ton Gmail au moment où tu cliques. Rien ne part sans toi.', 'Copier le texte');
  } else {
    const ligne = (l, v, cls = '') => `<div class="r-l"><span>${l}</span><div class="v ${cls}">${v}</div><span class="ok">${IC.ok}Rempli</span></div>`;
    h = `<div><p class="intro">Ce qui sera envoyé sur le site <b>${esc(site)}</b></p>
      <div class="relu">${IC.ok}Relu sur la page du site il y a un instant</div>
      <div class="recap">${ligne('Nom', PROFIL.nom)}${ligne('Mail', PROFIL.mail)}${ligne('Téléphone', PROFIL.tel)}${ligne('Lettre', esc(paras.slice(1).join(' ')), 'long')}${ligne('CV joint', IC2.trombone + 'CV Jordan.pdf', 'pj2')}</div></div>`;
    if (env.etape === 'captcha') h = h.replace(/<\/div>$/, '<p class="pause"><i></i>Envoi en pause : le site attend ta réponse, à droite.</p></div>') + `<div class="navig${env.anim ? ' anim' : ''}">
      <div class="nv-msg">${IC2.main}<div><b>Le site te demande une chose</b>Coche la case pour prouver que tu n'es pas un robot. Jobmind finit ensuite tout seul.</div></div>
      <div class="nv-barre"><span class="pts"><i></i><i></i><i></i></span><span class="url">${IC2.cadenas}carrieres.${slug(site)}.fr/postuler</span></div>
      <div class="nv-page"><div class="site"><i></i>${esc(site)}</div><h5>Postuler : ${esc(o.t)}</h5>
        <div class="ch">Nom<b>${PROFIL.nom}</b></div><div class="ch">Mail<b>${PROFIL.mail}</b></div><div class="ch">CV<b>CV Jordan.pdf</b></div>
        <div class="robot" id="robot"><span class="case">${IC.ok}</span>Je ne suis pas un robot<small>Vérification<br>du site</small></div></div>
      <div class="nv-pied">Ce panneau se ferme tout seul quand c'est fait.</div></div>`;
    else h += cote('Un navigateur caché remplit la page du site pour toi. Tu ne le vois que si le site te demande quelque chose.', 'Copier');
  }
  z.innerHTML = h;
}
function finirEnvoi() {
  const o = courant.o; F.postule.add(o.id);
  const id = 'n' + o.id;
  if (!trouverC(id)) CANDS.unshift({ id, t: o.t, e: o.e, v: o.v, km: o.km, cat: o.cat, src: o.src, ct: o.ct, r: o.r, st: 'envoyee', ev: [['envoyee', AUJ]] });
  env.etape = 'fini'; dessinerEnvoi();
}
function lancerEnvoi() { env.etape = 'envoi'; dessinerEnvoi(); setTimeout(finirEnvoi, 1300); }
$('#v-envoi').addEventListener('click', e => {
  if (e.target.closest('#go')) { if (!courant.o.mail && courant.o.captcha && !env.verifie) { env.etape = 'envoi'; dessinerEnvoi(); setTimeout(() => { env.etape = 'captcha'; env.anim = true; dessinerEnvoi(); }, 900); } else lancerEnvoi(); }
  const r = e.target.closest('#robot');
  if (r && !r.classList.contains('coche')) { r.classList.add('coche'); env.verifie = true; setTimeout(lancerEnvoi, 650); }
  const c = e.target.closest('[data-copie-mail]');
  if (c) { copier(texteLettre().join('\n\n')); c.innerHTML = IC.ok + 'Copié'; setTimeout(() => { c.innerHTML = IC.copie + (courant.o.mail ? 'Copier le texte' : 'Copier'); }, 1600); }
});

let tb;
function bulle(h) { const b = $('#bulle'); b.innerHTML = h; b.classList.add('vu'); clearTimeout(tb); tb = setTimeout(() => b.classList.remove('vu'), 2200); }

// ---------------------------------------------------------------- départ
function depuisAdresse() {
  const h = location.hash.slice(1);
  document.body.classList.add('instant');
  if (h === 'envoi') { montrer('candidature', { o: OFFRES[0] }, true); montrer('envoi'); }
  else if (h === 'envoi-site' || h === 'envoi-captcha') { montrer('candidature', { o: OFFRES[1] }, true); montrer('envoi', { o: OFFRES[1], etape: h === 'envoi-captcha' ? 'captcha' : 'pret' }); }
  else montrer(['offres', 'candidature'].includes(h) ? h : 'suivi', null, true);
  requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('instant')));
}
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== vue && !h.startsWith('envoi')) montrer(h === 'candidature' || h === 'offres' ? h : 'suivi'); });
depuisAdresse();
</script>
