<title>Jobmind proposition C</title>
<style>
:root { color-scheme: dark; --police: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --fond: #07060E; --fond2: #0E0B1C; --carte: rgba(22, 18, 42, 0.72); --carte2: rgba(32, 27, 60, 0.92); --ligne: #2A2546;
  --texte: #EEEAF5; --doux: #ABA4C4; --pale: #716A92; --P: #FFC93C; --S: #FF8A4C; --T: #B04BFF;
  --r: 18px; --anim: cubic-bezier(.2, .9, .3, 1); }
@property --a-tour { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
@keyframes tourne { to { --a-tour: 360deg; } }
@keyframes entre { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--fond); color: var(--texte); font-family: var(--police); }
body { display: flex; flex-direction: column; align-items: center; padding: 18px 16px 24px;
  background: radial-gradient(1100px 560px at 50% 120%, rgba(255, 201, 60, 0.08), transparent 60%), radial-gradient(900px 500px at -10% -20%, rgba(176, 75, 255, 0.08), transparent 60%), var(--fond); }
button, input, select, textarea { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; padding: 0; text-align: inherit; }
button:focus, input:focus, select:focus, textarea:focus { outline: none; }
button:focus-visible, input:focus-visible, select:focus-visible { box-shadow: 0 0 0 2px var(--fond), 0 0 0 4px var(--P); }
.consigne { width: min(1280px, 100%); margin: 0 0 12px; font-size: 15px; color: var(--doux); }
.consigne b { color: var(--texte); }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* ---------------------------------------------------------------- la fenêtre */
.appli { position: relative; width: min(1280px, 100%); height: 760px; border-radius: 22px; background: linear-gradient(180deg, #0D0A1E, #070611); isolation: isolate; display: flex; flex-direction: column; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55); }
.appli::before { content: ""; position: absolute; inset: -1.5px; border-radius: inherit; padding: 1.5px; pointer-events: none; z-index: 5;
  background: conic-gradient(from var(--a-tour), var(--P), var(--S), var(--T), var(--P));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  animation: tourne 10s linear infinite; opacity: 0.5; }
.haut { flex: none; height: 66px; display: flex; align-items: center; gap: 14px; padding: 0 24px; border-bottom: 1px solid rgba(42, 37, 70, 0.7); }
.marque { display: flex; align-items: center; gap: 11px; font-size: 19px; font-weight: 800; min-width: 170px; }
.marque svg { width: 32px; height: 32px; }
.retour { position: absolute; left: 200px; top: 15px; display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px 7px 9px; border-radius: 99px; background: rgba(255, 255, 255, 0.05); color: var(--doux); font-size: 14px; transition: background 200ms ease, color 200ms ease; }
.retour:hover { background: rgba(255, 255, 255, 0.1); color: var(--texte); }
.retour[hidden] { display: none; }
.onglets { display: flex; gap: 6px; margin: 0 auto; height: 100%; }
.onglet { position: relative; display: flex; align-items: center; gap: 9px; padding: 0 22px; font-size: 16.5px; font-weight: 600; color: var(--pale); transition: color 200ms ease; }
.onglet:hover { color: var(--doux); }
.onglet.actif { color: var(--texte); }
.onglet::after { content: ""; position: absolute; left: 18px; right: 18px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--P); box-shadow: 0 0 10px rgba(255, 201, 60, 0.6); transform: scaleX(0); transition: transform 300ms var(--anim); }
.onglet.actif::after { transform: scaleX(1); }
.onglet .nb { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 99px; background: rgba(255, 201, 60, 0.16); color: var(--P); font-size: 12.5px; font-weight: 700; display: grid; place-items: center; }
.haut .jour { min-width: 170px; text-align: right; color: var(--doux); font-size: 14.5px; }
.corps { position: relative; flex: 1; min-height: 0; overflow: hidden; border-radius: 0 0 22px 22px; }
.vue { position: absolute; inset: 0; display: flex; flex-direction: column; transition: opacity 320ms ease, transform 380ms var(--anim); }
.vue.cachee { opacity: 0; pointer-events: none; transform: translateY(10px); }
.split { flex: 1; min-height: 0; display: grid; grid-template-columns: 350px 1fr; }
.liste { overflow-y: auto; padding: 20px 14px 18px 18px; border-right: 1px solid rgba(42, 37, 70, 0.7); scrollbar-width: thin; scrollbar-color: var(--ligne) transparent; display: flex; flex-direction: column; }
.droite { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--ligne) transparent; position: relative; }
.droite-in { padding: 34px 52px 40px; animation: entre 380ms var(--anim); }

/* ---------------------------------------------------------------- listes */
.cherche { display: flex; align-items: center; gap: 9px; padding: 0 14px; height: 40px; border-radius: 12px; background: rgba(255, 255, 255, 0.045); color: var(--pale); margin-bottom: 16px; }
.cherche input { flex: 1; min-width: 0; border: 0; background: none; font-size: 14.5px; color: var(--texte); }
.cherche input::placeholder { color: var(--pale); }
.cherche:focus-within { background: rgba(255, 255, 255, 0.075); }
.groupe-t { display: flex; align-items: baseline; gap: 8px; margin: 14px 10px 6px; font-size: 13px; font-weight: 600; color: var(--doux); }
.groupe-t:first-of-type { margin-top: 2px; }
.groupe-t span { color: var(--pale); font-weight: 500; }
.ligne { position: relative; display: block; width: 100%; padding: 11px 12px 11px 14px; border-radius: 12px; transition: background 180ms ease; }
.ligne:hover { background: rgba(255, 255, 255, 0.04); }
.ligne.sel { background: rgba(255, 201, 60, 0.075); }
.ligne.sel::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--P); box-shadow: 0 0 8px rgba(255, 201, 60, 0.7); }
.l1 { display: flex; align-items: center; gap: 10px; }
.l1 .nom { flex: 1; min-width: 0; font-size: 15px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.l2 { margin-top: 3px; font-size: 13.5px; color: var(--doux); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.l3 { margin-top: 4px; font-size: 13px; color: #E9C871; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.terminee .l1 .nom, .terminee .l2 { color: var(--pale); }
.st { --c: #8A84AA; display: inline-flex; align-items: center; gap: 6px; flex: none; padding: 3px 9px 3px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap;
  background: color-mix(in srgb, var(--c) 15%, transparent); color: color-mix(in srgb, var(--c) 80%, #fff); }
.st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.bilan { margin-top: auto; padding: 18px 10px 2px; font-size: 13px; color: var(--pale); line-height: 1.55; }
.bilan b { color: var(--doux); font-weight: 600; }
.vide-l { padding: 16px 12px; color: var(--pale); font-size: 14px; }

/* ---------------------------------------------------------------- dossier */
.exemple { display: inline-block; margin-left: 10px; padding: 2px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 600; color: var(--pale); background: rgba(255, 255, 255, 0.05); vertical-align: middle; letter-spacing: 0.2px; }
.d-tete { display: flex; align-items: flex-start; gap: 20px; }
.d-tete .titres { flex: 1; min-width: 0; }
h1 { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.12; }
.sous { margin-top: 7px; font-size: 16px; color: var(--doux); }
.st-gros { position: relative; }
.st-gros > button.st { font-size: 14px; padding: 8px 14px 8px 12px; gap: 8px; }
.st-gros > button.st::before { width: 9px; height: 9px; }
.st-gros > button.st svg { width: 14px; height: 14px; margin-left: 2px; opacity: 0.7; }
.menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 20; width: 230px; padding: 7px; border-radius: 14px; background: var(--carte2); border: 1px solid var(--ligne); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); display: none; animation: entre 220ms var(--anim); }
.menu.ouvert { display: block; }
.menu button { display: flex; width: 100%; padding: 8px 10px; border-radius: 9px; font-size: 14px; align-items: center; gap: 10px; }
.menu button:hover { background: rgba(255, 255, 255, 0.06); }
.menu button i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.menu button.ici { color: var(--P); }
.ou { margin-top: 28px; font-size: 22px; font-weight: 600; line-height: 1.35; }
.ou-sous { margin-top: 5px; font-size: 14.5px; color: var(--pale); }
.frise { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 16px; font-size: 13px; color: var(--doux); }
.frise span { display: inline-flex; align-items: center; gap: 7px; }
.frise span i { width: 6px; height: 6px; border-radius: 50%; background: var(--pale); }
.frise span:last-child i { background: var(--P); }
.frise em { font-style: normal; color: var(--pale); }
.frise .fl { width: 22px; height: 1px; background: var(--ligne); }

.action { position: relative; margin-top: 26px; padding: 20px 22px; border-radius: var(--r); background: var(--carte); display: flex; align-items: center; gap: 18px; isolation: isolate; }
.action::before { content: ""; position: absolute; inset: -1.5px; border-radius: inherit; padding: 1.5px; pointer-events: none;
  background: conic-gradient(from var(--a-tour), var(--P), var(--S), var(--T), var(--P));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  animation: tourne 7s linear infinite; opacity: 0.75; }
.action .pic { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; flex: none; background: rgba(255, 201, 60, 0.13); color: var(--P); }
.action .pic svg { width: 22px; height: 22px; }
.action .txt { flex: 1; min-width: 0; }
.action .txt b { display: block; font-size: 17px; font-weight: 650; }
.action .txt span { display: block; margin-top: 3px; font-size: 14px; color: var(--doux); }
.action .bts { display: flex; gap: 10px; flex: none; }
.calme { margin-top: 24px; font-size: 14.5px; color: var(--pale); display: flex; align-items: center; gap: 10px; }
.calme svg { color: var(--pale); }

.bt { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 12px; font-size: 14.5px; font-weight: 600; background: rgba(255, 255, 255, 0.06); color: var(--texte); transition: background 200ms ease, transform 200ms var(--anim); white-space: nowrap; }
.bt:hover { background: rgba(255, 255, 255, 0.11); }
.bt.p { background: var(--P); color: #1C1503; }
.bt.p:hover { background: #FFD35E; transform: translateY(-1px); }
.bt.g { height: 48px; padding: 0 22px; font-size: 16px; border-radius: 14px; }
.bt.fait { background: rgba(61, 220, 132, 0.13); color: #7BE8AB; cursor: default; }
.bt.discret { background: none; color: var(--doux); padding: 0 10px; height: 34px; font-size: 13.5px; font-weight: 600; }
.bt.discret:hover { background: rgba(255, 255, 255, 0.06); color: var(--texte); }
.bt svg { width: 17px; height: 17px; }

.pilules { display: inline-flex; gap: 4px; padding: 4px; border-radius: 99px; background: rgba(255, 255, 255, 0.04); margin-top: 34px; }
.pilules button { padding: 8px 16px; border-radius: 99px; font-size: 14px; font-weight: 600; color: var(--doux); transition: background 200ms ease, color 200ms ease; display: inline-flex; gap: 7px; align-items: center; }
.pilules button:hover { color: var(--texte); }
.pilules button.actif { background: rgba(255, 201, 60, 0.14); color: var(--P); }
.pilules button small { font-size: 12px; font-weight: 600; color: #7BE8AB; }
.panneau { margin-top: 18px; animation: entre 300ms var(--anim); }
.meta { display: flex; align-items: center; gap: 12px; font-size: 13.5px; color: var(--pale); margin-bottom: 12px; }
.meta .bt { margin-left: auto; }
.lettre { padding: 24px 28px; border-radius: 16px; background: rgba(255, 255, 255, 0.03); font-size: 15.5px; line-height: 1.7; white-space: pre-wrap; color: #DDD8EA; max-width: 720px; }
.offre-txt { font-size: 15px; line-height: 1.7; white-space: pre-wrap; color: #D6D1E4; max-width: 720px; }
.notes { width: 100%; max-width: 720px; min-height: 150px; padding: 18px 20px; border-radius: 16px; border: 1px solid transparent; background: rgba(255, 255, 255, 0.035); font-size: 15px; line-height: 1.6; resize: vertical; color: var(--texte); }
.notes:focus { border-color: rgba(255, 201, 60, 0.35); }
.petit { font-size: 13px; color: var(--pale); margin-top: 8px; }

/* ---------------------------------------------------------------- offres */
.barre { flex: none; padding: 16px 24px 14px; border-bottom: 1px solid rgba(42, 37, 70, 0.7); display: flex; flex-direction: column; gap: 12px; }
.barre .rang { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.barre .cherche { flex: 1; min-width: 220px; margin: 0; height: 42px; }
.champ { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 6px 0 14px; border-radius: 12px; background: rgba(255, 255, 255, 0.045); color: var(--pale); font-size: 14.5px; }
.champ select { border: 0; background: none; color: var(--texte); font-size: 14.5px; padding: 0 6px; height: 100%; cursor: pointer; }
.champ select option { background: #17132C; }
.puces { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.puce { height: 34px; padding: 0 14px; border-radius: 99px; font-size: 13.5px; font-weight: 600; color: var(--doux); background: rgba(255, 255, 255, 0.04); border: 1px solid transparent; display: inline-flex; align-items: center; gap: 7px; transition: all 200ms ease; }
.puce:hover { color: var(--texte); background: rgba(255, 255, 255, 0.07); }
.puce.on { color: var(--P); border-color: rgba(255, 201, 60, 0.45); background: rgba(255, 201, 60, 0.09); }
.puce.on::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--P); }
.puce select { border: 0; background: none; color: inherit; font-weight: 600; cursor: pointer; padding: 0; }
.puce select option { background: #17132C; color: var(--texte); }
.compte { margin-left: auto; font-size: 13px; color: var(--pale); }
.split.offres { grid-template-columns: 390px 1fr; }
.liste .l3.raison { color: #CDBB8A; }
.ligne .neuf { width: 7px; height: 7px; border-radius: 50%; background: var(--P); flex: none; }
.ligne .ico { color: var(--P); display: inline-flex; }
.ligne .ico svg { width: 15px; height: 15px; }
.ligne .env { font-size: 11.5px; font-weight: 600; color: #7BE8AB; }
.hors { margin-top: 14px; padding: 10px 12px; border-radius: 12px; font-size: 13.5px; color: var(--pale); display: flex; align-items: center; gap: 8px; width: 100%; }
.hors:hover { background: rgba(255, 255, 255, 0.04); color: var(--doux); }
.hors svg { width: 15px; height: 15px; transition: transform 250ms var(--anim); }
.hors.ouvert svg { transform: rotate(180deg); }
.horsliste .ligne { opacity: 0.62; }
.horsliste .l3 { color: var(--pale); }

.o-actions { display: flex; gap: 6px; flex: none; }
.rond { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.05); color: var(--doux); transition: all 200ms ease; }
.rond:hover { background: rgba(255, 255, 255, 0.1); color: var(--texte); }
.rond.on { color: var(--P); background: rgba(255, 201, 60, 0.12); }
.rond.on svg.etoile { fill: var(--P); }
.pourquoi { margin-top: 20px; display: flex; align-items: center; gap: 10px; font-size: 16px; color: #E9D49A; }
.pourquoi svg { color: var(--P); }
.pourquoi.hs { color: var(--doux); }
.infos { display: flex; flex-wrap: wrap; gap: 10px 36px; margin-top: 26px; }
.infos div { font-size: 13px; color: var(--pale); }
.infos b { display: block; margin-top: 3px; font-size: 15px; color: var(--texte); font-weight: 600; }
.prete { margin-top: 26px; }
.prete .txt b { font-size: 16.5px; }

.cand { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 30px; margin-top: 22px; animation: entre 300ms var(--anim); }
.lettre[contenteditable="true"] { border: 1px solid transparent; transition: border-color 200ms ease; cursor: text; }
.lettre[contenteditable="true"]:focus { border-color: rgba(255, 201, 60, 0.35); }
.lettre.brute { color: var(--doux); background: rgba(255, 255, 255, 0.018); border: 1px dashed var(--ligne); }
mark.gen { background: rgba(255, 201, 60, 0.12); color: inherit; border-bottom: 1.5px dashed rgba(255, 201, 60, 0.7); border-radius: 3px; padding: 1px 2px; }
.gen-note { margin-top: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13.5px; color: var(--doux); max-width: 720px; }
.gen-note i { width: 14px; height: 6px; border-radius: 2px; background: rgba(255, 201, 60, 0.3); border-bottom: 1.5px dashed var(--P); }
.sous-lettre { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.cote h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--pale); }
.naturel { padding: 2px 0 20px; }
.naturel .val { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
.naturel .val small { font-size: 15px; color: var(--pale); font-weight: 600; margin-left: 4px; letter-spacing: 0; }
.jauge { height: 6px; border-radius: 6px; background: rgba(255, 255, 255, 0.07); margin-top: 8px; overflow: hidden; }
.jauge i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--S), var(--P)); transition: width 600ms var(--anim); }
.q { padding: 12px 0; border-top: 1px solid rgba(42, 37, 70, 0.7); }
.q .qt { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--doux); }
.q .qt .bt { margin-left: auto; height: 28px; padding: 0 8px; font-size: 12.5px; }
.q p { margin: 6px 0 0; font-size: 14px; line-height: 1.5; color: #D6D1E4; }
.conseil { margin-top: 6px; padding: 12px 14px; border-radius: 12px; background: rgba(255, 255, 255, 0.035); font-size: 13.5px; line-height: 1.5; color: var(--doux); }
.envoi-bar { display: flex; flex-direction: column; align-items: stretch; gap: 8px; margin: 0 0 24px; }
.envoi-bar .note { text-align: center; }
.envoi-bar .note { font-size: 13px; color: var(--pale); }
.vide-d { height: 100%; display: grid; place-items: center; color: var(--pale); font-size: 15px; }

/* ---------------------------------------------------------------- l'envoi */
.envoi { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; background: rgba(7, 6, 14, 0.6); backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity 300ms ease; }
.envoi.ouvert { opacity: 1; pointer-events: auto; }
.envoi-cadre { position: relative; margin: 22px 40px; flex: 1; min-height: 0; border-radius: 20px; background: #100D22; border: 1px solid var(--ligne); display: flex; flex-direction: column; box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6); transform: translateY(14px); transition: transform 380ms var(--anim); overflow: hidden; }
.envoi.ouvert .envoi-cadre { transform: none; }
.e-haut { flex: none; display: flex; align-items: center; gap: 14px; padding: 16px 22px; border-bottom: 1px solid rgba(42, 37, 70, 0.7); }
.e-haut .t { flex: 1; min-width: 0; }
.e-haut .t b { display: block; font-size: 17px; }
.e-haut .t span { font-size: 13.5px; color: var(--pale); }
.facon { display: inline-flex; gap: 4px; padding: 4px; border-radius: 99px; background: rgba(255, 255, 255, 0.04); }
.facon span { padding: 7px 14px; border-radius: 99px; font-size: 13.5px; font-weight: 600; color: var(--pale); display: inline-flex; align-items: center; gap: 7px; }
.facon span.actif { background: rgba(255, 201, 60, 0.14); color: var(--P); }
.facon span svg { width: 15px; height: 15px; }
.e-corps { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--ligne) transparent; }
.e-bas { flex: none; display: flex; align-items: center; gap: 14px; padding: 12px 22px; border-top: 1px solid rgba(42, 37, 70, 0.7); font-size: 13.5px; color: var(--doux); }
.e-bas > svg { color: var(--P); }
.e-bas .bt { margin-left: auto; }
/* le mail */
.mail { max-width: 820px; margin: 0 auto; padding: 22px 30px 26px; }
.m-ch { display: flex; align-items: baseline; gap: 14px; padding: 11px 0; border-bottom: 1px solid rgba(42, 37, 70, 0.7); font-size: 15px; }
.m-ch span { width: 64px; flex: none; color: var(--pale); font-size: 13.5px; }
.m-ch input { flex: 1; border: 0; background: none; font-size: 15px; color: var(--texte); }
.m-txt { margin-top: 16px; min-height: 230px; font-size: 15px; line-height: 1.7; white-space: pre-wrap; color: #DDD8EA; padding: 4px 2px; border-radius: 8px; }
.m-txt:focus { background: rgba(255, 255, 255, 0.02); }
.pj { display: inline-flex; align-items: center; gap: 10px; margin-top: 14px; padding: 9px 14px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); font-size: 14px; }
.pj svg { color: #FF8A7A; }
.pj small { color: var(--pale); }
.m-bas { display: flex; align-items: center; gap: 12px; margin-top: 22px; }
.m-bas .de { font-size: 13.5px; color: var(--pale); }
.m-bas .bt { margin-left: auto; }
/* le site intégré */

/* ---------------------------------------------------------------- calculs offres */
function centre() { return { metz: 'Metz', thionville: 'Thionville', nancy: 'Nancy' }[S.lieu] || 'Metz'; }

function raison(o) {

function note(o) {

  n += ({ logistique: 12, vente: 8, entretien: 6, info: 6, autre: 0 })[o.fam];
  n += ({ CDI: 3, CDD: 1 })[o.contrat] || 0;
  if (S.q && (o.titre + ' ' + o.missions).toLowerCase().indexOf(S.q.toLowerCase()) >= 0) n += 20;

}

  if (S.f.tele && !o.tele) return false;

}

      '<div style="margin-top:14px"><button class="bt" data-stylebt>' + (S.style ? 'Désactiver la réécriture' : 'Activer la réécriture') + '</button></div>' +
      '<div class="h2">Les règles fixes</div><ul class="regles"><li>Pas de « C\'est avec un grand intérêt » ni de « Fort de ».</li><li>Phrases courtes, une idée par phrase.</li><li>Dire bonjour, signer Jordan, rien de plus.</li><li>Un fait concret plutôt qu\'un adjectif (« rigoureux », « motivé »).</li></ul>' +
      '<div class="h2">Mes textes, pour apprendre mon style</div><textarea class="notes" style="margin-top:8px;min-height:110px">Bonjour, je vous écris pour la place au magasin. J\'ai fait un an de vente chez un magasin de sport à Metz, ça m\'a plu. Je peux venir quand vous voulez.</textarea>';
  } else if (S.pSel === 'cherche') {
    h += '<h1>Ce que je cherche</h1><div class="sous">Sert à trier les offres. Les autres restent visibles, rangées à part.</div><div class="faits">' +
      [['Métiers', 'Logistique, entrepôt, vente en magasin, support informatique, entretien'], ['Autour de', 'Metz, 30 km'], ['Contrats', 'CDI, CDD, intérim'], ['Mises à jour', 'Toutes les 3 heures, et au clic'], ['Sources', 'France Travail, Adzuna']]
        .map(function (f) { return '<div class="fait"><span>' + f[0] + '</span>' + f[1] + '</div>'; }).join('') + '</div>';
  } else {
    h += '<h1>Réglages</h1><div class="h2">Me prévenir après combien de jours sans réponse</div><div style="display:flex;align-items:center;gap:12px;margin-top:10px"><input class="nombre" id="alerte" type="number" min="3" max="60" value="' + S.alerte + '"><span style="color:var(--doux)">jours</span></div><div class="petit">Change le chiffre : les relances à faire se mettent à jour dans Candidatures.</div>' +
      '<div class="h2">Envoi par mail</div><div class="faits" style="margin-top:0"><div class="fait"><span>Gmail</span>' + PROFIL.mail + ' (exemple), branché</div></div>' +
      '<div class="h2">Exporter mes candidatures</div><div style="display:flex;gap:10px;margin-top:10px"><button class="bt" data-export>En tableau (CSV)</button><button class="bt" data-export>En PDF</button></div>';
  }
  $('profDroite').innerHTML = h + '</div>';
}

/* ---------------------------------------------------------------- navigation */
function etat() { return { tab: S.tab, cSel: S.cSel, cSub: S.cSub, oSel: S.oSel, oSub: S.oSub, pSel: S.pSel }; }
function aller(ch, sansPile) {
  if (!sansPile) pile.push(etat());
  for (var k in ch) S[k] = ch[k];
  if (ch.oSel || ch.oSub) S.brut = false;
  rendTout();
}
function rendTout() {
  ['cand', 'offres', 'profil'].forEach(function (t) { $('v-' + t).classList.toggle('cachee', S.tab !== t); });
  document.querySelectorAll('.onglet').forEach(function (b) { b.classList.toggle('actif', b.dataset.tab === S.tab); });
  $('retour').hidden = !pile.length;
  rendCandListe(); rendDossier(); rendOffListe(); rendOffre(); rendProfil();
}
function bulle(t, bouton) {
  var b = $('bulle'); b.innerHTML = '<span>' + t + '</span>' + (bouton || '');
  b.classList.add('vu'); clearTimeout(bulle.t); bulle.t = setTimeout(function () { b.classList.remove('vu'); }, bouton ? 5000 : 2200);
}
function copier(t) {
  var ok = function () { bulle('Copié'); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(ok, function () { vieux(t); ok(); });
  else { vieux(t); ok(); }
}
function vieux(t) { var a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = '0'; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (e) {} a.remove(); }
function premierAFaire() {
  var g = C.filter(function (c) { return action(c); }).sort(function (a, b) { return action(a).ordre - action(b).ordre || jours(b.envoi) - jours(a.envoi); });
  return (g[2] || g[0] || C[0]).id;
}

document.addEventListener('click', function (e) {
  var t = e.target.closest('button, [data-tab]'); if (!t) { var m = $('stMenu'); if (m) m.classList.remove('ouvert'); return; }
  var d = t.dataset, c = C.filter(function (x) { return x.id === S.cSel; })[0], o = O.filter(function (x) { return x.id === S.oSel; })[0];
  if (t.id !== 'stBt' && !t.closest('#stMenu')) { var mm = $('stMenu'); if (mm) mm.classList.remove('ouvert'); }
  if (t.id === 'retour') { if (pile.length) { var p = pile.pop(); for (var k in p) S[k] = p[k]; fermerEnvoi(); rendTout(); } return; }
  if (d.tab) { if (d.tab !== S.tab) { fermerEnvoi(); aller({ tab: d.tab }); } return; }
  if (d.c) { aller({ cSel: d.c, cSub: 'env' }); return; }
  if (d.o) { var oo = O.filter(function (x) { return x.id === d.o; })[0]; oo.neuf = false; aller({ oSel: d.o, oSub: 'offre' }); return; }
  if (d.p) { aller({ pSel: d.p }); return; }
  if (d.sub) { S.cSub = d.sub; rendDossier(); return; }
  if (d.osub) { aller({ oSub: d.osub }); return; }
  if (t.id === 'stBt') { $('stMenu').classList.toggle('ouvert'); return; }
  if (d.st) {
    if (d.st !== c.statut) { c.statut = d.st; c.statutDate = iso(AUJ); c.hist.push({ d: iso(AUJ), t: d.st }); if (d.st !== 'Entretien') c.entretien = null; bulle('Statut changé : ' + d.st); }
    rendCandListe(); rendDossier(); return;
  }
  if (d.faire) {
    var nv = { relancee: 'Relancée', sans: 'Sans réponse', entretien: 'Entretien' }[d.faire];
    c.statut = nv; c.statutDate = iso(AUJ); c.hist.push({ d: iso(AUJ), t: nv }); if (nv === 'Entretien') { c.action = null; c.entretien = null; }
    bulle(nv === 'Relancée' ? 'Noté : relancée aujourd\'hui' : 'Statut changé : ' + nv);
    rendCandListe(); rendDossier(); return;
  }
  if (d.copie) {
    var txt = '';
    if (d.copie === 'relance') txt = 'Bonjour,\n\nJe reviens vers vous au sujet de ma candidature au poste de ' + c.poste.toLowerCase() + ', envoyée le ' + court(c.envoi) + '. Le poste m\'intéresse toujours et je reste disponible pour en parler.\n\nJordan';
    else if (d.copie === 'lettreC') txt = c.lettre;
    else if (d.copie === 'lettreO') txt = S.brut ? prep(o).brut : ($('lettreO') ? $('lettreO').innerText : lettreFinale(o));
    else if (d.copie === 'lettreE') { var mt = $('envoiCadre').querySelector('.m-txt, textarea'); txt = mt ? (mt.tagName === 'TEXTAREA' ? mt.value : mt.innerText) : lettreFinale(E.o); }
    else if (d.copie[0] === 'q') txt = prep(o).q[+d.copie.slice(1)][1];
    copier(txt); return;
  }
  if (d.tog) { o[d.tog] = !o[d.tog]; bulle(d.tog === 'fav' ? (o.fav ? 'Ajoutée aux favoris' : 'Retirée des favoris') : (o.tard ? 'Gardée pour plus tard' : 'Retirée de « plus tard »')); rendOffListe(); rendOffre(); return; }
  if (d.ouvrir !== undefined) { bulle('Dans l\'appli, l\'offre s\'ouvre sur ' + o.src + '.'); return; }
  if (d.preparer !== undefined) {
    t.textContent = 'Préparation...'; t.disabled = true;
    setTimeout(function () { prep(o).faite = true; aller({ oSub: 'cand' }, true); bulle('Candidature prête'); }, 900); return;
  }
  if (d.corriger !== undefined) { prep(o).corrige = true; rendOffre(); bulle('Phrase remplacée. Naturel : ' + prep(o).mieuxScore + ' sur 100'); return; }
  if (d.brut !== undefined) { S.brut = !S.brut; rendOffre(); return; }
  if (d.envoyer !== undefined) { var le = $('lettreO'); if (le) { var p2 = prep(o); var tx = le.innerText; if (tx !== lettreFinale(o)) { p2.avant = tx; p2.gen = ''; p2.fin = ''; } } ouvrirEnvoi(o); return; }
  if (d.fermer !== undefined) { fermerEnvoi(); return; }
  if (d.envoimail !== undefined) { enregistrerEnvoi(E.o, 'Par mail à ' + E.o.mail); E.etape = 'fini'; rendEnvoi(); return; }
  if (d.envoisite !== undefined) {
    E.etape = 'envoi'; rendEnvoi();
    setTimeout(function () { if (E.o.captcha && !E.o.captchaFait) { E.etape = 'captcha'; rendEnvoi(); } else finirSite(); }, 1300); return;
  }
  if (d.voirc) { fermerEnvoi(); aller({ tab: 'cand', cSel: d.voirc, cSub: 'env' }); return; }
  if (d.int) { S.intensite = d.int; rendProfil(); return; }
  if (d.stylebt !== undefined) { S.style = !S.style; rendProfil(); return; }
  if (d.export !== undefined) { bulle('Dans l\'appli, le fichier se range dans Documents.'); return; }
  if (t.id === 'horsBt') { S.hors = !S.hors; rendOffListe(); return; }
  if (d.f) { S.f[d.f] = !S.f[d.f]; rendOffListe(); return; }
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'qC') { S.qC = t.value; rendCandListe(); }
  else if (t.id === 'q') { S.q = t.value; rendOffListe(); }
  else if (t.id === 'notes') { C.filter(function (x) { return x.id === S.cSel; })[0].notes = t.value; }
  else if (t.id === 'alerte') { var v = parseInt(t.value, 10); if (v >= 3 && v <= 60) { S.alerte = v; rendCandListe(); rendDossier(); } }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'lieu') { S.lieu = t.value; rendOffListe(); rendOffre(); }
  else if (t.id === 'rayon') { S.rayon = +t.value; rendOffListe(); }
  else if (t.id === 'contrat') { S.contrat = t.value; rendOffListe(); }
  else if (t.id === 'captcha' && t.checked) { E.o.captchaFait = true; E.etape = 'captchaok'; rendEnvoi(); setTimeout(function () { E.etape = 'envoi'; rendEnvoi(); setTimeout(finirSite, 1000); }, 700); }
});

/* ---------------------------------------------------------------- liens directs */
function route() {
  var h = location.hash.replace('#', '');
  pile = []; fermerEnvoi();
  S.cSel = S.cSel || premierAFaire();
  if (h === 'offres') { S.tab = 'offres'; S.oSel = 'o1'; S.oSub = 'offre'; }
  else if (h === 'candidature') { pile = [{ tab: 'offres', cSel: S.cSel, cSub: 'env', oSel: 'o1', oSub: 'offre', pSel: 'cv' }]; S.tab = 'offres'; S.oSel = 'o1'; S.oSub = 'cand'; }
  else if (h === 'envoi' || h === 'envoi-mail' || h === 'envoi-captcha') {
    var id = h === 'envoi-mail' ? 'o2' : 'o1';
    pile = [{ tab: 'offres', cSel: S.cSel, cSub: 'env', oSel: id, oSub: 'offre', pSel: 'cv' }]; S.tab = 'offres'; S.oSel = id; S.oSub = 'cand';
    rendTout(); ouvrirEnvoi(O.filter(function (x) { return x.id === id; })[0]);
    if (h === 'envoi-captcha') { E.etape = 'captcha'; rendEnvoi(); }
    return;
  }
  else if (h === 'profil') { S.tab = 'profil'; }
  else { S.tab = 'cand'; }
  rendTout();
}
window.addEventListener('hashchange', route);
document.body.classList.add('sansanim');
route();
document.addEventListener('pointerdown', function () { document.body.classList.remove('sansanim'); }, { once: true, capture: true });
</script>
