[package]
name = "jobmind-sources"
version = "0.1.0"
description = "Les sources d'offres de Jobmind : la page lue (« Ajouter à Jobmind »), les sites lus en coulisse et les alertes mail. Sans écran et sans Windows"
edition.workspace = true
license.workspace = true
publish.workspace = true

# L'option « faux » : le faux serveur local (127.0.0.1) qui sert les pages d'exemple des sites, pour la construction
# d'essai de l'appli (jamais livrée). Les tests de ce crate s'en servent aussi, sans l'option.
[features]
faux = []

[dependencies]
# Versions figées (« = ») : une nouvelle version n'entre que par un changement relu.
# Les erreurs de lecture d'une page, nommées (la même version que celle déjà tirée par Tauri)
thiserror = "=2.0.21"
# Les données structurées des pages (JSON-LD) et l'archive de chaque offre (le même serde_json que le reste de
# l'espace de travail)
serde_json = { version = "=1.0.154", features = ["preserve_order"] }

[lints]
workspace = true
