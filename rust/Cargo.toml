# Le Rust de Jobmind (étape 1 du plan : « le squelette dans Mindset »). Structure et réglages repris du Rust de
# Paymind (D:\Projets\Paymind\rust), lui-même repris de Mindcare et du Rust de Mindset.
[workspace]
resolver = "3"
members = [
    "jobmind-core",
    "jobmind-storage",
    "jobmind-lecture",
    "jobmind-sources",
    "jobmind-llm",
    "jobmind-humanizer",
    "jobmind-mail",
    "jobmind-vie",
    "jobmind-relais",
    "jobmind-app",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

# La bibliothèque commune de la suite (dépôt Mindset), épinglée à une révision relue (jamais une copie du code), la
# même que Mindcare : json_sur et les chemins comme .NET, le dossier WebView2 des applis Tauri, les thèmes et la lecture
# des fichiers de pack. Sans ses options par défaut : ni la signature (ring), ni les zips (zip), ni l'heure de Windows ;
# elle n'apporte que serde_json.
[workspace.dependencies]
suite-commun = { git = "https://github.com/JordanJacquot/Mindset", rev = "0aad77c0fd1cd92983775bec64646e1486cc857e", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
